[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "real-time-fraud-detection"
version = "0.1.0"
description = "Real-time fraud and anomaly detection system with explainability and MLOps."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<4.0",
    "imbalanced-learn>=0.12,<1.0",
    "shap>=0.46,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "redis>=5.0,<7.0",
    "kafka-python>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "joblib>=1.4,<2.0",
    "mlflow>=2.17,<4.0",
    "prometheus-client>=0.21,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]


[project.scripts]
fraud-train = "src.training.train_xgboost:main"
fraud-api = "src.api.main:main"


[tool.setuptools.packages.find]
include = ["src*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
]


[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "data",
    "models",
    "notebooks",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
]

ignore = [
    "E501",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = [
    "^tests/",
]